<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析报告 - 心理量表测评平台</title>
    <meta name="description" content="AI深度分析报告">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="./index.html">
                <i class="bi bi-heart-pulse-fill me-2"></i>moonsheep
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">首页</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- 返回首页链接 -->
                    <a href="./index.html" class="back-link">
                        <i class="bi bi-arrow-left me-1"></i>返回首页
                    </a>

                    <!-- 加载中状态 -->
                    <div id="loadingState" class="loading-container">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                        <p>正在加载分析报告...</p>
                    </div>

                    <!-- 错误状态 -->
                    <div id="errorState" class="error-state d-none">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <h4>加载失败</h4>
                        <p id="errorMessage">网络错误，请检查网络连接后重试</p>
                        <button class="btn btn-primary" id="retryBtn">
                            <i class="bi bi-arrow-clockwise me-1"></i>重新加载
                        </button>
                    </div>

                    <!-- 报告内容（动态渲染） -->
                    <div id="reportContainer" class="d-none">
                        <!-- 内容由 report.js 动态渲染 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="./index.html">首页</a>
            </div>
            <small>心理量表测评平台 &copy; 2024 | 专业心理评估服务</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Markdown 渲染（本地托管，避免 CDN 在国内无法访问） -->
    <script src="./assets/js/marked.min.js"></script>
    <!-- Mermaid 图表渲染（本地托管，v11.6+ 支持雷达图） -->
    <script src="./assets/js/mermaid.min.js"></script>
    <!-- 配置文件 -->
    <script src="./assets/js/config.js"></script>
    <!-- API 封装 -->
    <script src="./assets/js/api.js"></script>
    <!-- 报告页逻辑 -->
    <script src="./assets/js/report.js"></script>
</body>

</html>
