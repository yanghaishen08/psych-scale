<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理量表测评平台 - 专业心理评估</title>
    <meta name="description" content="科学评估，深度分析，助您更好地了解自己。提供专业的心理量表测评服务。">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="./index.html">
                <i class="bi bi-heart-pulse-fill me-2"></i>心理量表平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="./index.html">首页</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="py-4">
        <div class="container">
            <!-- Hero 区域 -->
            <div class="hero-section">
                <div class="hero-icon">
                    <i class="bi bi-heart-pulse-fill"></i>
                </div>
                <h1 class="display-4 fw-bold mb-3">专业心理量表测评</h1>
                <p class="lead">科学评估，深度分析，助您更好地了解自己</p>
            </div>

            <!-- 加载中状态 -->
            <div id="loadingState" class="loading-container">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p>正在加载量表列表...</p>
            </div>

            <!-- 错误状态 -->
            <div id="errorState" class="error-state d-none">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <h4>加载失败</h4>
                <p id="errorMessage">网络错误，请检查网络连接后重试</p>
                <button class="btn btn-primary" id="retryBtn">
                    <i class="bi bi-arrow-clockwise me-1"></i>重新加载
                </button>
            </div>

            <!-- 空状态 -->
            <div id="emptyState" class="empty-state d-none">
                <i class="bi bi-inbox"></i>
                <p>暂无量表，请稍后访问</p>
            </div>

            <!-- 量表卡片列表 -->
            <div class="row" id="scalesContainer"></div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="./index.html">首页</a>
            </div>
            <small>心理量表测评平台 &copy; 2024 | 专业心理评估服务</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 配置文件 -->
    <script src="./assets/js/config.js"></script>
    <!-- API 封装 -->
    <script src="./assets/js/api.js"></script>
    <!-- 首页逻辑 -->
    <script src="./assets/js/main.js"></script>
</body>

</html>
